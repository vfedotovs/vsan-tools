name: vlr-bundle-parser image

# Builds the VLR bundle parser web UI and publishes it to
# ghcr.io/vfedotovs/vlr-bundle-parser (linux/amd64 + linux/arm64).
on:
  push:
    branches: [main]
    paths:
      - "vlr-bundle-parser/**"
      - ".github/workflows/vlr-bundle-parser-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: vlr-bundle-parser
          file: vlr-bundle-parser/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vfedotovs/vlr-bundle-parser:latest
            ghcr.io/vfedotovs/vlr-bundle-parser:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Web UI for parsing VMware Live Recovery 9.0.x appliance support bundles
